# Render Blueprint for Brydl Dashboard.
# Deploy: push this repo to GitHub/GitLab, then Render Dashboard ->
# "New +" -> "Blueprint" -> pick the repository.
#
# DATABASE: Powered by Supabase PostgreSQL (or any hosted PostgreSQL).
# Paste your Supabase URI into DATABASE_URL (Transaction Pooler: port 6543
# or Direct Session: port 5432).
#
# SCHEMA: production never uses db.create_all(). The build command runs
# `flask db upgrade` (migrations/) on every deploy BEFORE the service
# starts, so the database schema is always the migrated, versioned one.
services:
  - type: web
    name: brydl-dashboard
    env: python
    plan: free
    autoDeploy: true
    buildCommand: pip install -r requirements.txt && flask --app app db upgrade
    # Pilot single-worker deployment: 1 worker enforces in-process sliding-window
    # rate limiting strictly (N=1) on the client LLM endpoint.
    startCommand: gunicorn -k uvicorn.workers.UvicornWorker --workers 1 asgi:app
    # Healthz lives in the RedLab sub-app. It returns 200 even when
    # REDLAB_ENABLED is false, so the platform keeps serving the Flask
    # app throughout the phased v14 rollout.
    healthCheckPath: /redlab/healthz
    envVars:
      # Matches runtime.txt; Render installs this Python version.
      - key: PYTHON_VERSION
        value: "3.11.6"
      # Render generates a strong random value on first deploy and
      # keeps it stable across restarts (sessions/CSRF depend on it).
      - key: SECRET_KEY
        generateValue: true
      # Hard opt-in to production behaviour (blocks seed.py, etc.).
      - key: FLASK_ENV
        value: production
      # Cookies Secure/HSTS activate automatically via the RENDER env
      # var that Render injects; nothing to configure here.
      # Schema authority in production is `flask db upgrade` (build
      # command); direct create_all stays a local-dev-only convenience.
      - key: BRYDL_AUTO_SCHEMA
        value: "0"
      # RedLab dynamic red-teaming (v14):
      - key: REDLAB_ENABLED
        value: "true"
      # Dedicated Fernet encryption key for client LLM targets
      - key: REDLAB_FERNET_KEY
        sync: false
      # Supabase PostgreSQL database connection URI:
      # Paste from Supabase Project Settings -> Database -> Connection String (URI).
      # Format (Transaction Pooler): postgresql://postgres.[project-ref]:[password]@aws-0-[region].pooler.supabase.com:6543/postgres?sslmode=require
      # Format (Direct Session): postgresql://postgres:[password]@db.[project-ref].supabase.co:5432/postgres?sslmode=require
      - key: DATABASE_URL
        sync: false
